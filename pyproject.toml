[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentscope==1.0.11",
    "agentscope-runtime==1.0.5",
    "anthropic==0.49.0", 
    "celery[redis]>=5.4.0",
    "fastmcp>=2.14.3",
    "httpx>=0.28.1",
    "mcp>=1.25.0",
    "mem0ai>=1.0.1",
    "pymilvus>=2.6.6",
    "python-dotenv>=1.2.1",
    "redis>=5.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "shap>=0.49.1",
    # 工程化依赖
    "tortoise-orm[asyncpg]>=0.24.0",
    "pydantic-settings>=2.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "aerich>=0.7.0",
    "zai-sdk>=0.2.1",
]

[tool.aerich]
tortoise_orm = "app.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

# 覆盖率配置：本地与 CI 共用，避免门禁阈值只存在于流水线里。
# 基线：2026-10-28 实测 90 项测试、总覆盖率 41.13%（6382 行）。
# 阈值只用于防止退化；提升覆盖率后应同步上调，不要下调来让 PR 变绿。
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
fail_under = 40

